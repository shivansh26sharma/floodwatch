<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 920" width="1060" height="920"
     color="#111827" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
     role="img"
     aria-label="FloodWatch architecture: four real data sources are normalised to a canonical district-day schema at a single loader boundary, joined, turned into features at day t that predict a flood label at day t plus one, split chronologically into train, validation and test, used to fit three models, then evaluated with a threshold chosen on validation and applied unchanged to test.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ================= ROW 1 : SOURCES ================= -->
  <text x="40" y="24" font-size="11" font-weight="700" letter-spacing="1.2" opacity="0.55">REAL DATA SOURCES</text>

  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <rect x="40"  y="36" width="208" height="64" rx="6"/>
    <rect x="272" y="36" width="208" height="64" rx="6"/>
    <rect x="504" y="36" width="208" height="64" rx="6"/>
  </g>
  <rect x="736" y="36" width="224" height="64" rx="6" fill="none" stroke="#2563eb" stroke-width="1.6"/>

  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="144" y="60">IMD rainfall</text>
    <text x="376" y="60">India-WRIS river level</text>
    <text x="608" y="60">SRTM terrain</text>
    <text x="848" y="60" fill="#2563eb">DFO flood events</text>
  </g>
  <g font-size="10" opacity="0.65" text-anchor="middle">
    <text x="144" y="78">data.gov.in</text>
    <text x="144" y="91">daily, wide format</text>
    <text x="376" y="78">CWC gauges</text>
    <text x="376" y="91">per-station files</text>
    <text x="608" y="78">one-off zonal stats</text>
    <text x="608" y="91">elevation · slope</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#2563eb">
    <text x="848" y="78">THE LABELS</text>
    <text x="848" y="91">coarse event polygons</text>
  </g>

  <!-- arrows into loader band -->
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)">
    <line x1="144" y1="100" x2="144" y2="132"/>
    <line x1="376" y1="100" x2="376" y2="132"/>
    <line x1="608" y1="100" x2="608" y2="132"/>
  </g>
  <line x1="848" y1="100" x2="848" y2="132" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ahb)"/>

  <!-- ================= ROW 2 : LOADER BOUNDARY ================= -->
  <rect x="40" y="136" width="920" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="500" y="161" font-size="13" font-weight="700" text-anchor="middle">loaders.py — the quarantine layer</text>
  <text x="500" y="180" font-size="10.5" text-anchor="middle" opacity="0.7">
    the only four functions that know each source's format · reshape → district-day rows
  </text>

  <!-- the boundary line: the architectural claim -->
  <line x1="24" y1="212" x2="976" y2="212" stroke="currentColor" stroke-width="1" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="500" y="228" font-size="10.5" font-weight="600" text-anchor="middle" opacity="0.75">
    ── canonical schema: date · district · value ── everything below is source-agnostic and already tested ──
  </text>

  <!-- ================= ROW 3 : DATASET ================= -->
  <line x1="500" y1="236" x2="500" y2="258" stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="270" y="262" width="460" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="500" y="284" font-size="12.5" font-weight="600" text-anchor="middle">build_dataset — join to one district-day table</text>
  <text x="500" y="302" font-size="10" text-anchor="middle" opacity="0.7">gaps ≤2d interpolated within district · longer gaps dropped · imputation flagged</text>

  <!-- ================= ROW 4 : FEATURES + TARGET SHIFT ================= -->
  <line x1="500" y1="318" x2="500" y2="344" stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="40" y="348" width="550" height="124" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="60" y="370" font-size="12.5" font-weight="700">features available at day t</text>
  <g font-size="10.5" opacity="0.8">
    <text x="60" y="392">· lags 1–7d and rolling windows, closed="left" — today excluded</text>
    <text x="60" y="410">· antecedent wetness: 15-day cumulative rain (is the ground already full?)</text>
    <text x="60" y="428">· rainfall departure vs climatology fitted on TRAIN YEARS ONLY</text>
    <text x="60" y="446">· river rate-of-change · terrain interactions (rain ÷ slope, 1 ÷ elevation)</text>
    <text x="60" y="464">· all lag/roll operations grouped by district — no cross-district bleed</text>
  </g>

  <!-- the forward-prediction mechanism -->
  <rect x="650" y="373" width="310" height="74" rx="6" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <text x="805" y="397" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2563eb">target: flood at t + 1</text>
  <text x="805" y="415" font-size="10.5" text-anchor="middle" fill="#2563eb" opacity="0.9">label shifted forward per district</text>
  <text x="805" y="433" font-size="10" text-anchor="middle" opacity="0.7">same-day prediction = 0.98 AUC, zero warning time</text>

  <line x1="592" y1="412" x2="644" y2="412" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
  <text x="618" y="400" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2563eb">predicts</text>

  <!-- ================= ROW 5 : CHRONOLOGICAL SPLIT ================= -->
  <text x="40" y="512" font-size="11" font-weight="700" letter-spacing="1.2" opacity="0.55">CHRONOLOGICAL SPLIT — NEVER SHUFFLED</text>

  <line x1="500" y1="472" x2="500" y2="494" stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- timeline bar -->
  <rect x="40"  y="524" width="580" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="620" y="524" width="130" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="750" y="524" width="210" height="44" rx="4" fill="none" stroke="#2563eb" stroke-width="1.6"/>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="330" y="545">TRAIN</text>
    <text x="685" y="545">VALIDATION</text>
    <text x="855" y="545" fill="#2563eb">TEST</text>
  </g>
  <g font-size="10" text-anchor="middle" opacity="0.7">
    <text x="330" y="561">2010 — 2016 · 20,400 rows</text>
    <text x="685" y="561">2017 · 2,920</text>
  </g>
  <text x="855" y="561" font-size="10" text-anchor="middle" fill="#2563eb">2018 — 2019 · includes Kerala 2018</text>

  <line x1="40" y1="582" x2="930" y2="582" stroke="currentColor" stroke-width="1" opacity="0.45" marker-end="url(#ah)"/>
  <text x="940" y="586" font-size="10" text-anchor="start" opacity="0.6">time →</text>

  <!-- ================= ROW 6 : MODELS ================= -->
  <text x="40" y="638" font-size="11" font-weight="700" letter-spacing="1.2" opacity="0.55">THREE MODELS, IDENTICAL SPLIT AND FEATURES</text>

  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <rect x="40"  y="650" width="294" height="52" rx="6"/>
    <rect x="353" y="650" width="294" height="52" rx="6"/>
    <rect x="666" y="650" width="294" height="52" rx="6"/>
  </g>
  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="187" y="672">Logistic Regression</text>
    <text x="500" y="672">Random Forest</text>
    <text x="813" y="672">XGBoost</text>
  </g>
  <g font-size="10" text-anchor="middle" opacity="0.7">
    <text x="187" y="690">the baseline you must beat</text>
    <text x="500" y="690">class_weight = balanced</text>
    <text x="813" y="690">scale_pos_weight from train</text>
  </g>

  <!-- ================= ROW 7 : EVALUATION ================= -->
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)">
    <line x1="187" y1="702" x2="187" y2="738"/>
    <line x1="500" y1="702" x2="500" y2="738"/>
    <line x1="813" y1="702" x2="813" y2="738"/>
  </g>

  <rect x="40" y="742" width="920" height="118" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="60" y="764" font-size="12.5" font-weight="700">evaluate — ranked by what corresponds to people being warned</text>

  <g font-size="10.5" opacity="0.85">
    <text x="60" y="786">1 · LEAD TIME — hours between first alarm and onset, reported with ALARM DUTY CYCLE</text>
    <text x="60" y="804">2 · THRESHOLD — minimises expected cost at 20:1 miss-to-false-alarm, not left at 0.5</text>
    <text x="60" y="822">3 · CALIBRATION — Brier + reliability curve; "70%" must mean it floods 70% of the time</text>
    <text x="60" y="840">4 · DISCRIMINATION — PR-AUC beside ROC-AUC (6% positives), recall before precision</text>
  </g>

  <!-- threshold chosen on val, applied to test: the anti-cheat arrow -->
  <path d="M 685 568 L 685 614 L 1024 614 L 1024 790 L 966 790"
        fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahb)"/>
  <text x="1040" y="700" font-size="9.5" font-weight="700" fill="#2563eb" text-anchor="middle"
        transform="rotate(-90 1040 700)">threshold fixed on validation, applied unchanged to test</text>

  <!-- SHAP side note -->
  <text x="940" y="764" font-size="10" text-anchor="end" opacity="0.7">+ SHAP: global (report) · local per district-day (dashboard)</text>
</svg>
