# ============================================================
# FloodWatch configuration
# ------------------------------------------------------------
# Switching from the synthetic test fixture to real data is a
# ONE-LINE change: set data.source to "real" and fill in the
# paths under data.real.
# ============================================================

project:
  name: FloodWatch
  anchor_event: "Kerala 2018"
  region: India

  # Which districts to study. Accepts:
  #   all                  every district in src/data/districts.py (~70)
  #   basin:Brahmaputra    a single river basin
  #   state:Kerala         a single state
  #   [Patna, Dhubri]      an explicit list
  # Nationwide is the default: it gives the DFO archive far more events to
  # label, which is what keeps a training split from ending up empty.
  districts: [Alappuzha, Barpeta, Cachar, Dhemaji, Dhubri, Dibrugarh, Ernakulam, Goalpara, Idukki, Jorhat, Kamrup, Kottayam, Lakhimpur, Majuli, Morigaon, Nagaon, Palakkad, Pathanamthitta, Sivasagar, Thrissur, Tinsukia, Wayanad]

  # Study period. WIDE ON PURPOSE. Real flood archives record only LARGE
  # events, so a narrow window can leave a split with zero positives and
  # nothing to learn from. ERA5, GloFAS and DFO all cover this range.
  start_date: "2000-01-01"
  end_date: "2023-12-31"

data:
  # "fixture"     = synthetic data for pipeline testing ONLY.
  # "real"        = the raw ERA5/GloFAS/DFO downloads (local only; the raw
  #                 files are gitignored).
  # "precomputed" = the committed joined dataset. REAL data, 2.7MB, so a
  #                 deploy serves real numbers without the raw sources.
  source: precomputed

  fixture:
    path: data/fixtures
    # Dates come from project.start_date / project.end_date.
    seed: 42
    # The fixture only has to prove the pipeline runs, so it covers a
    # subset of districts. Generating all ~70 over 24 years would make the
    # cloud bootstrap slow for no benefit.
    max_districts: 8

  real:
    # Fill these in once the real downloads land in data/raw/
    rainfall: data/raw/rainfall_era5.csv      # written by src/data/download.py
    river: data/raw/river_glofas.csv          # written by src/data/download.py
    terrain: data/raw/terrain_elevation.csv   # written by src/data/download.py
    labels: data/raw/Global_Flood_Records.gpkg  # DFO GeoPackage (polygons) — see README

  processed: data/processed/dataset.parquet

  # Used when source == precomputed. A SCOPED slice of the real dataset,
  # small enough to commit and to train on a 1GB host. The full
  # 75-district frame is ~504MB in RAM before training starts, which would
  # OOM Streamlit's free tier; one basin is a fraction of that.
  precomputed_path: data/processed/demo_dataset.parquet

features:
  # TARGET DEFINITION — the single most consequential setting here.
  #   onset_window : does a flood BEGIN within target_window days?
  #   ongoing      : is a flood in progress at t+horizon?
  # Use onset_window. DFO changed how long it keeps events open (20.0 days
  # average in 2000-2014 vs 8.6 days in 2017-2023, with the same number of
  # events per year), so "ongoing" trains and tests on different
  # conventions. Onset is a fact about the world; duration is bookkeeping.
  target_mode: onset_window
  target_window: 7

  # Lag windows in days for rainfall and river level
  lags: [1, 2, 3, 5, 7]
  rolling_windows: [3, 7, 14, 30]
  # Antecedent wetness proxy: cumulative rainfall over this many days
  antecedent_window: 15
  # Rainfall departure is computed against the day-of-year climatology
  climatology_min_years: 5

split:
  # STRICTLY CHRONOLOGICAL. Never shuffle time series.
  # Boundaries chosen so the anchor event (Kerala 2018) lands in TEST while
  # train still spans 15 years — enough for sparse DFO events to appear in
  # every split. Check the class counts the trainer prints; if any split
  # shows 0.00% positive, widen project.start_date rather than shuffling.
  train_end: "2014-12-31"
  val_end: "2016-12-31"
  # Everything after val_end is the test set (includes the 2018 event)

models:
  target: flood_occurred
  random_state: 42
  logistic:
    max_iter: 2000
    class_weight: balanced
  random_forest:
    n_estimators: 400
    max_depth: 12
    min_samples_leaf: 5
    class_weight: balanced
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

forecast:
  # What we forecast. river_discharge_m3s is the primary target: it is smoother,
  # more autocorrelated and directly flood-relevant. rainfall_mm is much
  # harder (zero-inflated) — see the note in src/models/forecast.py.
  target: river_discharge_m3s
  exog: [rainfall_mm]          # additional inputs the LSTM may use
  horizons: [1, 3, 7]          # days ahead to evaluate
  arima_order: [2, 0, 2]       # (p, d, q); see module docstring on selection
  lstm:
    window: 30                 # days of history fed to the network
    hidden: 48
    layers: 1
    dropout: 0.1
    epochs: 40
    batch_size: 128
    lr: 0.003
    patience: 6                # early stopping on validation MAE

evaluation:
  # Missing a real flood is far worse than a false alarm.
  # Threshold is chosen to minimise expected cost, not to maximise F1.
  cost_false_negative: 20
  cost_false_positive: 1
  # Lead time is measured as hours between first threshold crossing
  # and recorded flood onset.
  lead_time_units: hours
  calibration_bins: 10

outputs:
  figures: outputs/figures
  models: outputs/models
  reports: outputs/reports
